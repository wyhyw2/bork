name: Build Unsigned Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 解压
    - name: Unzip Project
      run: |
        unzip BandSpark.zip
        ls -la

    # 2. 设置 JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. 自动寻找真实的项目目录（解决路径错误）
    - name: Find Project Path
      id: find_path
      run: |
        if [ -f "./gradlew" ]; then
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        elif [ -d "BandSpark" ] && [ -f "BandSpark/gradlew" ]; then
          echo "PROJECT_DIR=BandSpark" >> $GITHUB_ENV
        else
          echo "未找到 gradlew，请检查压缩包结构！"
          exit 1
        fi

    # 4. 生成 Gradle Wrapper 并赋予权限
    - name: Generate Gradle Wrapper
      run: |
        cd ${{ env.PROJECT_DIR }}
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    # 5. 编译 Debug APK
    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        ./gradlew assembleDebug

    # 6. 上传 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
