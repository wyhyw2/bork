name: BandSpark 云打包

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ---------- 1. 拉代码 ----------
      - name: 1. Checkout
        uses: actions/checkout@v4

      # ---------- 2. 诊断：看清仓库到底长什么样 ----------
      - name: 2. 仓库结构诊断
        run: |
          echo "===== 根目录 ====="
          ls -la
          echo "===== 找 settings.gradle（项目根标志）====="
          find . -name settings.gradle -not -path "*/\.git/*"
          echo "===== 找 gradlew ====="
          find . -name gradlew -not -path "*/\.git/*"
          echo "===== 找 gradle-wrapper.jar（ziptogit 常丢的文件）====="
          find . -name gradle-wrapper.jar -not -path "*/\.git/*"
          echo "===== 找 aar ====="
          find . -name "*.aar" -not -path "*/\.git/*" -exec ls -lh {} \;

      # ---------- 3. 自动定位项目根 ----------
      # 兼容两种情况：文件散落在仓库根目录 / 外面还套了一层 bork-main 文件夹
      - name: 3. 自动定位项目根目录
        id: locate
        run: |
          PROJECT_DIR=""
          for d in . ./bork-main ./BandSpark ./bork-main/bork-main; do
            if [ -f "$d/settings.gradle" ]; then
              PROJECT_DIR="$d"
              break
            fi
          done
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::找不到 settings.gradle，请把项目文件放到仓库根目录"
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "项目根目录 = $PROJECT_DIR"

      # ---------- 4. JDK 17 ----------
      - name: 4. 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ---------- 5. Android SDK ----------
      - name: 5. 安装 Android SDK
        uses: android-actions/setup-android@v4

      # ---------- 6. 补齐 Gradle Wrapper（最关键一步）----------
      # build.yml 原文件没有这一步，ziptogit 上传时二进制 jar 丢了，
      # ./gradlew 直接报 Could not find or load main class org.gradle.wrapper.GradleWrapperMain
      - name: 6. 生成缺失的 gradle-wrapper.jar
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo ">>> 缺少 gradle-wrapper.jar，正在下载 Gradle 8.10.2 并重新生成"
            curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew
          echo "===== wrapper 内容 ====="
          ls -l gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties

      # ---------- 7. 清理 gradle.properties 里的前导空格 ----------
      # 原来有一行 " android.r8.proguardAndroidTxt.disallowed=false" 开头带空格，去掉更稳妥
      - name: 7. 清理 gradle.properties
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/^[[:space:]]\+//' gradle.properties
          echo "===== gradle.properties ====="
          cat gradle.properties

      # ---------- 8. 编译 ----------
      - name: 8. 编译 Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ---------- 9. 列出产物 ----------
      - name: 9. 列出 APK 产物
        run: |
          echo "===== 全仓库 apk ====="
          find . -name "*.apk" -not -path "*/\.git/*" -exec ls -lh {} \;
          echo "===== 预期路径 ====="
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/" || true

      # ---------- 10. 上传成品（ Actions 页面右侧 Artifacts 下载）----------
      - name: 10. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: BandSpark-debug
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
