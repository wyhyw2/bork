name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许在 Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK 17 (Android 构建必需)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # 开启 Gradle 缓存，加快后续构建速度

      # 3. 配置 Android SDK (已升级至 v4，修复之前的报错)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. 赋予 gradlew 执行权限 (手机端上传的代码通常缺失此权限)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 执行 Gradle 构建 Debug APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 6. 上传打包好的 APK (已升级至 v4 避免弃用警告)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
