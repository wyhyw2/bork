name: Build Unsigned Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 解压代码
    - name: Unzip Project
      run: |
        unzip BandSpark.zip
        ls -la

    # 2. 设置 JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. 自动寻找项目目录
    - name: Find Project Path
      id: find_path
      run: |
        if [ -f "./gradlew" ]; then
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        elif [ -d "BandSpark" ] && [ -f "BandSpark/gradlew" ]; then
          echo "PROJECT_DIR=BandSpark" >> $GITHUB_ENV
        else
          echo "未找到项目目录"
          exit 1
        fi

    # 4. 自动关闭混淆（核心修复！）
    - name: Disable Minify
      run: |
        cd ${{ env.PROJECT_DIR }}
        # 兼容 .gradle 和 .gradle.kts 两种格式
        sed -i 's/minifyEnabled true/minifyEnabled false/g' app/build.gradle || true
        sed -i 's/minifyEnabled true/minifyEnabled false/g' app/build.gradle.kts || true
        sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' app/build.gradle || true
        sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' app/build.gradle.kts || true
        echo "混淆配置已临时关闭"

    # 5. 生成 Gradle Wrapper 并赋予权限
    - name: Generate Gradle Wrapper
      run: |
        cd ${{ env.PROJECT_DIR }}
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    # 6. 编译 Debug APK
    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        ./gradlew assembleDebug

    # 7. 上传 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
